<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライブカメラリンクス | 現地は？ 天気は？ 道は？</title>
    <meta name="description" content="道路・高速道路・駅・繁華街・観光地・河川・空港・港など全国のライブカメラを地図から探せます。">
    <meta name="keywords" content="ライブカメラ,道路ライブカメラ,高速道路,駅ライブカメラ,観光地ライブカメラ,ライブカメラリンクス">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/camera-cards.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
<header class="site-header">
    <h1>📷 ライブカメラリンクス</h1>
    <p class="tagline">現地は？　天気は？　道は？</p>
</header>
<main>
    <section class="search-panel">
        <h2>検索</h2>
        <label for="destination">目的地</label>
        <input id="destination" type="text" placeholder="例：箱根・東京駅・白川郷">
        <label for="departure">出発地</label>
        <input id="departure" type="text" placeholder="例：新宿・横浜・名古屋">
        <button id="searchButton">検索</button>
    </section>

    <section class="map-panel">
        <h2>🗺 地図</h2>
        <div id="map"></div>
    </section>

    <section class="camera-panel">
        <div class="camera-panel-head">
            <h2>📷 ライブカメラ一覧</h2>
            <span id="cameraCount" class="camera-count">読み込み中…</span>
        </div>
        <div id="camera-list">
            <p>ライブカメラデータを読み込んでいます。</p>
        </div>
    </section>
</main>
<footer class="site-footer">© 2026 LiveCameraLinks / Build 0.1.8</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data/cameras.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
