function toggleFav(id){const c=CAMERAS.find(x=>x.id===id);if(!c)return;const u=preferredUrl(c);if(!u)return;let a=favs(),i=a.findIndex(x=>x&&x.url===u);if(i>=0)a.splice(i,1);else a.unshift({name:c.name,road:c.place||c.kind||'',url:u});a=a.slice(0,10);localStorage.setItem(FKEY,JSON.stringify(a));render()}
function card(c){let f=isFav(c);let p=c.providerPageUrl||'';let d=c.directStreamUrl||'';let provider=p?`<a class="btn" target="_blank" rel="noopener" href="${esc(p)}">${ytChannel(p)?'📺 YouTubeチャンネル':'🏢 配信元'}</a>`:'';let direct=d?`<a class="btn" target="_blank" rel="noopener" href="${esc(d)}">▶ 当該映像ビュー</a>`:'';let mapbtn=(Number.isFinite(+c.lat)&&Number.isFinite(+c.lng))?`<a class="btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lng}#map=15/${c.lat}/${c.lng}">地図 ↗</a>`:'';return `<article class="card" id="${esc(c.id)}"><button class="fav" type="button" title="お気に入り" onclick="toggleFav('${esc(c.id)}')">${f?'★':'☆'}</button><h3>${esc(c.icon||'📷')} ${esc(c.name)}</h3><div class="meta">${esc(c.place||'')} · ${esc(c.kind||'')}</div><div class="tags">${tagsFor(c)}</div><p>${esc(c.desc||'')}</p>${provider}${direct}${mapbtn}</article>`}
function render(){let a=filtered();$('count').textContent=`${a.length}件 / 全${CAMERAS.length}件`; $('grid').innerHTML=a.map(card).join(''); if(map)drawMap(a)}
function drawMap(a){layer.clearLayers();let pts=[];a.forEach(c=>{if(Number.isFinite(+c.lat)&&Number.isFinite(+c.lng)){L.marker([+c.lat,+c.lng]).addTo(layer).bindPopup(`<b>${esc(c.name)}</b><br>${esc(c.place||'')}<br><a href="#${esc(c.id)}" onclick="document.getElementById('cardsBtn').click()">カードを見る</a>`);pts.push([+c.lat,+c.lng])}});$('mapNote').textContent=`${a.length}件のうち位置情報がある${pts.length}地点を表示`;if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:15})}
$('tabs').innerHTML=CATS.map(x=>`<button data-c="${x[1]}" class="${x[1]==='all'?'on':''}">${x[0]}</button>`).join('');$('tabs').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b===e.target));render()}};
$('cardsBtn').onclick=()=>{$('grid').style.display='grid';$('map').style.display='none';$('mapNote').style.display='none';$('cardsBtn').classList.add('on');$('mapBtn').classList.remove('on')};$('mapBtn').onclick=()=>{$('grid').style.display='none';$('map').style.display='block';$('mapNote').style.display='block';$('mapBtn').classList.add('on');$('cardsBtn').classList.remove('on');if(!map){map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}setTimeout(()=>{map.invalidateSize();drawMap(filtered())},50)};render();
</script></body></html>
