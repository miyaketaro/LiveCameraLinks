function has(c,k){const t=blob(c);if(k==='all')return true;if(k==='expressway')return /高速道路|首都高|高速|JCT|ジャンクション|PA|SA|インターチェンジ|\bIC\b/i.test(t);if(k==='road')return /道路|国道|都道|県道|交差点|通り|街道|環七|環八|道路状況|渋滞/.test(t)||has(c,'expressway');if(k==='rail')return /駅|鉄道|新幹線|電車|JR|私鉄|モノレール|ゆりかもめ|車両センター/.test(t);if(k==='river')return /河川|防災|川|水門|調節池|水位|堤防/.test(t);if(k==='town')return /繁華街|街並み|街中|商店街|駅前|スクランブル|歌舞伎町|センター街|アーケード/.test(t);if(k==='tourism')return /観光|公園|寺|神社|城|タワー|スカイツリー|ドーム|庭園|景勝|展望/.test(t);if(k==='airport')return /空港|滑走路|ターミナル/.test(t);if(k==='port')return /港湾|港|埠頭|ふ頭|運河|海|湾|岸壁|フェリー/.test(t);return false}
