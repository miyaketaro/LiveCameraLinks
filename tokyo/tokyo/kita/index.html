const CATS=[["すべて","all"],["🛣 道路","road"],["🚗 高速道路","expressway"],["🚉 駅・鉄道","rail"],["🌊 河川","river"],["🏙 街並み・繁華街","town"],["🏔 観光","tourism"],["✈ 空港","airport"],["⚓ 港・海","port"]];

function blob(c){return [c.name,c.place,c.kind,c.desc,...(c.themes||[]),...(c.viewTargets||[]),...(c.aliases||[])].filter(Boolean).join(' ')}
function has(c,k){const t=blob(c);if(k==='all')return true;if(k==='expressway')return /高速道路|首都高|高速|JCT|ジャンクション|PA|SA|インターチェンジ|\bIC\b/i.test(t);if(k==='road')return /道路|国道|都道|県道|交差点|通り|街道|環七|環八|道路状況|渋滞/.test(t)||has(c,'expressway');if(k==='rail')return /駅|鉄道|新幹線|電車|JR|私鉄|モノレール|ゆりかもめ|車両センター/.test(t);if(k==='river')return /河川|防災|川|水門|調節池|水位|堤防/.test(t);if(k==='town')return /繁華街|街並み|街中|商店街|駅前|スクランブル|歌舞伎町|センター街|アーケード/.test(t);if(k==='tourism')return /観光|公園|寺|神社|城|タワー|スカイツリー|ドーム|庭園|景勝|展望/.test(t);if(k==='airport')return /空港|滑走路|ターミナル/.test(t);if(k==='port')return /港湾|港|埠頭|ふ頭|運河|海|湾|岸壁|フェリー/.test(t);return false}
function filtered(){return CAMERAS.filter(c=>has(c,cat))}
function ytChannel(u){return /youtube\.com\/(?:@|channel\/|c\/|user\/)/.test(u||'')&&!/[?&]v=|watch\?/.test(u||'')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tagsFor(c){return CATS.slice(1).filter(x=>has(c,x[1])).map(x=>`<span class="tag">${x[0]}</span>`).join('')}
const FKEY='livecameralinks_favorites_v1';
function favs(){try{const a=JSON.parse(localStorage.getItem(FKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function preferredUrl(c){return c.directStreamUrl||c.providerPageUrl||c.url||''}
function isFav(c){const u=preferredUrl(c);return !!u&&favs().some(x=>x&&x.url===u)}

function card(c){let f=isFav(c);let p=c.providerPageUrl||'';let d=c.directStreamUrl||'';let provider=p?`<a class="btn" target="_blank" rel="noopener" href="${esc(p)}">${ytChannel(p)?'📺 YouTubeチャンネル':'🏢 配信元'}</a>`:'';let direct=d?`<a class="btn" target="_blank" rel="noopener" href="${esc(d)}">▶ 当該映像ビュー</a>`:'';let mapbtn=(Number.isFinite(+c.lat)&&Number.isFinite(+c.lng))?`<a class="btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lng}#map=15/${c.lat}/${c.lng}">地図 ↗</a>`:'';return `<article class="card" id="${esc(c.id)}"><button class="fav" type="button" title="お気に入り" onclick="toggleFav('${esc(c.id)}')">${f?'★':'☆'}</button><h3>${esc(c.icon||'📷')} ${esc(c.name)}</h3><div class="meta">${esc(c.place||'')} · ${esc(c.kind||'')}</div><div class="tags">${tagsFor(c)}</div><p>${esc(c.desc||'')}</p>${provider}${direct}${mapbtn}</article>`}
